plugins {
    id 'java-library'
}

tasks.withType(JavaCompile) {
    options.encoding 'UTF-8'
    options.compilerArgs.add("-parameters")
}

dependencies {
	api project(':uaa-authentication-backend')
	api project(':uaa-authorization-spring-boot-autoconfigure')

	api libs.springBootAutoconfigure
	annotationProcessor libs.springBootConfigProcessor
	api libs.springBootStarterSecurity
	api libs.springBootStarterValidation

}

description = 'UAA:: Backend Authentication:: Spring Boot AutoConfiguration'
