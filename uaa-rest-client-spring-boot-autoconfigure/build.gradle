plugins {
    id 'java-library'
}

tasks.withType(JavaCompile) {
    options.encoding 'UTF-8'
    options.compilerArgs.add("-parameters")
}

tasks.withType(Test) {
    useJUnitPlatform()
}

dependencies {
    api project(':uaa-rest-client')
    api libs.serverConnectorAutoconfig
    api libs.springBootAutoconfigure
    annotationProcessor libs.springBootConfigProcessor
    api libs.springBootStarterValidation
    api libs.inject
}

description = 'UAA:: REST Client:: Autoconfiguration'


