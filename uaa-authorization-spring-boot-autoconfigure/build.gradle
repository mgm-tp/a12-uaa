plugins {
    id 'java-library'
}

tasks.withType(JavaCompile) {
    options.encoding 'UTF-8'
    options.compilerArgs.add("-parameters")
}

tasks.withType(Test) {
    useJUnitPlatform()
}

dependencies {
	api project(':uaa-authorization')

	api libs.springBootAutoconfigure
	annotationProcessor libs.springBootConfigProcessor
	api libs.springBootStarterSecurity
	api libs.springBootStarterValidation
	
	
}

description = 'UAA:: Authorization:: Spring Boot AutoConfiguration'

